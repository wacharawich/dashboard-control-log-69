<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <path id="arcBottom" d="M 56 256 A 200 200 0 0 0 456 256"/>
    <path id="arcRight" d="M 383 383 A 180 180 0 0 0 383 129"/>
    <path id="arcLeft" d="M 129 129 A 180 180 0 0 0 129 383"/>
    <g id="person">
      <circle cx="0" cy="-13" r="7"/>
      <path d="M -9 -3 Q 0 -10 9 -3 L 7 15 L 2.5 15 L 2.5 3 L -2.5 3 L -2.5 15 L -7 15 Z"/>
    </g>
  </defs>

  <!-- badge -->
  <circle cx="256" cy="256" r="250" fill="#ffffff"/>
  <circle cx="256" cy="256" r="245" fill="none" stroke="#111111" stroke-width="8"/>

  <!-- yellow crescent (right) -->
  <path d="M 312 96 A 168 168 0 0 1 312 416 A 210 210 0 0 0 312 96 Z" fill="#ffd400"/>
  <circle cx="336" cy="256" r="24" fill="#e6a800"/>

  <!-- green heart (left) -->
  <path d="M 215 178 C 185 122 112 120 89 172 C 66 224 104 292 215 366 C 326 292 364 224 341 172 C 318 120 245 122 215 178 Z" fill="#4caf3e"/>
  <circle cx="172" cy="222" r="24" fill="#1b5e20"/>
  <circle cx="252" cy="222" r="24" fill="#1b5e20"/>

  <!-- star of people (top) -->
  <use xlink:href="#person" transform="translate(256,92)" fill="#4caf50"/>
  <use xlink:href="#person" transform="translate(290,117) rotate(72)" fill="#2196f3"/>
  <use xlink:href="#person" transform="translate(277,157) rotate(144)" fill="#f44336"/>
  <use xlink:href="#person" transform="translate(235,157) rotate(216)" fill="#9c27b0"/>
  <use xlink:href="#person" transform="translate(222,117) rotate(288)" fill="#ff9800"/>

  <!-- caduceus -->
  <path d="M 248 232 C 224 208 186 198 152 210 C 172 218 184 228 192 242 C 210 234 232 232 248 240 Z" fill="#4caf3e"/>
  <path d="M 264 232 C 288 208 326 198 360 210 C 340 218 328 228 320 242 C 302 234 280 232 264 240 Z" fill="#4caf3e"/>
  <rect x="251" y="205" width="10" height="140" rx="5" fill="#1565c0"/>
  <path d="M 256 345 C 224 336 224 306 256 296 C 288 286 288 256 256 248" fill="none" stroke="#1e88e5" stroke-width="9" stroke-linecap="round"/>
  <circle cx="256" cy="212" r="8" fill="#f9a825"/>
  <path d="M 256 170 C 243 187 245 202 256 210 C 267 202 269 187 256 170 Z" fill="#e53935"/>

  <!-- curved text -->
  <text font-family="Prompt, 'Noto Sans Thai', sans-serif" font-size="44" font-weight="700" fill="#111111">
    <textPath xlink:href="#arcBottom" href="#arcBottom" startOffset="50%" text-anchor="middle">โรงพยาบาลนางรอง</textPath>
  </text>
  <text font-family="Prompt, sans-serif" font-size="19" font-weight="600" fill="#9e9e9e" letter-spacing="2">
    <textPath xlink:href="#arcRight" href="#arcRight" startOffset="50%" text-anchor="middle">NANGRONG HOSPITAL</textPath>
  </text>
  <text font-family="Prompt, 'Noto Sans Thai', sans-serif" font-size="18" font-weight="600" fill="#2e7d32">
    <textPath xlink:href="#arcLeft" href="#arcLeft" startOffset="50%" text-anchor="middle">บริการด้วยหัวใจ ได้คุณภาพ</textPath>
  </text>
