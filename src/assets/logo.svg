<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <path id="arcTop" d="M 41 256 A 215 215 0 0 1 471 256"/>
    <path id="arcBottom" d="M 56 256 A 200 200 0 0 0 456 256"/>
  </defs>

  <!-- outer white disc with green rim -->
  <circle cx="256" cy="256" r="254" fill="#ffffff"/>
  <circle cx="256" cy="256" r="250" fill="none" stroke="#157a3c" stroke-width="5"/>

  <!-- inner green disc -->
  <circle cx="256" cy="256" r="182" fill="#157a3c"/>

  <!-- curved text: Thai (top) -->
  <text font-family="Prompt, 'Noto Sans Thai', sans-serif" font-size="42" font-weight="700" fill="#157a3c">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">กระทรวงสาธารณสุข</textPath>
  </text>
  <!-- curved text: English (bottom) -->
  <text font-family="Prompt, Arial, sans-serif" font-size="30" font-weight="700" fill="#157a3c" letter-spacing="2">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">MINISTRY OF PUBLIC HEALTH</textPath>
  </text>

  <!-- side leaf ornaments -->
  <g fill="#157a3c">
    <g transform="translate(40,256)">
      <path d="M0,-18 C-8,-9 -8,9 0,18 C8,9 8,-9 0,-18 Z"/>
      <path d="M-2,0 C-14,-4 -20,-12 -20,-20 C-10,-18 -4,-10 -2,0 Z"/>
      <path d="M-2,0 C-14,4 -20,12 -20,20 C-10,18 -4,10 -2,0 Z"/>
    </g>
    <g transform="translate(472,256) scale(-1,1)">
      <path d="M0,-18 C-8,-9 -8,9 0,18 C8,9 8,-9 0,-18 Z"/>
      <path d="M-2,0 C-14,-4 -20,-12 -20,-20 C-10,-18 -4,-10 -2,0 Z"/>
      <path d="M-2,0 C-14,4 -20,12 -20,20 C-10,18 -4,10 -2,0 Z"/>
    </g>
  </g>

  <!-- caduceus (white on green) -->
  <g fill="#ffffff">
    <!-- flame -->
    <path d="M 256 122 C 240 146 236 166 245 183 C 234 176 228 163 229 150 C 219 168 223 188 238 199 L 274 199 C 289 188 293 168 283 150 C 284 163 278 176 267 183 C 276 166 272 146 256 122 Z"/>
    <!-- torch cup -->
    <path d="M 238 199 L 274 199 L 267 218 L 245 218 Z"/>
    <!-- wings -->
    <path d="M 246 214 C 210 194 166 190 134 204 C 154 212 166 221 172 234 C 190 225 216 226 246 240 Z"/>
    <path d="M 266 214 C 302 194 346 190 378 204 C 358 212 346 221 340 234 C 322 225 296 226 266 240 Z"/>
    <!-- staff -->
    <rect x="250" y="206" width="12" height="204" rx="6"/>
    <path d="M 244 410 L 268 410 L 256 432 Z"/>
    <!-- snake heads -->
    <ellipse cx="272" cy="234" rx="10" ry="7"/>
    <ellipse cx="240" cy="234" rx="10" ry="7"/>
  </g>
  <!-- snakes weaving around the staff -->
  <path d="M 268 240 C 306 254 306 284 256 298 C 206 312 206 342 256 356 C 306 370 306 400 262 412" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M 244 240 C 206 254 206 284 256 298 C 306 312 306 342 256 356 C 206 370 206 400 250 412" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
</svg>
